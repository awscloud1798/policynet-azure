name: hello
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: pip install azure-cli==2.65.0
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az account show
